<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Business Profile Widget</title>
    <link rel="stylesheet" href="login-form.css">
</head>
<body>
    <div class="login-page">
        <div class="image-container">
            <img class="profile-image" src="images/image-photo.jpg" alt="Profile portrait">
        </div>

        <main class="login-card">
            <h1>Flat Business Profile Widget</h1>

            <form>
                <div class="form-field">
                    <input class="name-input" type="text" placeholder="Name" aria-label="Name">
                </div>
                <div class="form-field">
                    <input class="password-input" type="password" placeholder="Password" aria-label="Password">
                </div>
                <input class="submit-button" type="submit" value="Submit">
            </form>
        </main>

        <footer>&copy; 2016 Flat Business Profile Widget. All rights reserved</footer>
    </div>
</body>
</html>
