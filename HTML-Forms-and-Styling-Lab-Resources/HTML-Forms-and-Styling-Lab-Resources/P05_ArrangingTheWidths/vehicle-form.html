<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Audi Vehicles</title>
    <link rel="stylesheet" href="vehicle-form.css">
</head>
<body>
    <main class="vehicle-card">
        <h1>Rent Audi Vehicles</h1>

        <form>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Name">

            <label for="vehicle">Select</label>
            <select id="vehicle" name="vehicle">
                <option value="">Select</option>
                <option>Audi 80</option>
                <option>Audi 90</option>
                <option>Audi RS 6</option>
                <option>Audi S8</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Send</button>
        </form>
    </main>
</body>
</html>
